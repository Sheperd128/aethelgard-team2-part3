<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aethelgard | Trial 01: Grid Runner</title>
    <style>
        :root { --bg: #061a14; --card: #0b2920; --accent: #10b981; --text: #ecfdf5; --border: #134e4a; --error: #f43f5e; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; user-select: none; }
        body { background-color: var(--bg); color: var(--text); padding: 1.5rem 1rem; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; background: var(--card); border: 1px solid var(--border); padding: 1.5rem; border-radius: 8px; text-align: center; }
        h2 { color: var(--accent); margin-bottom: 0.3rem; letter-spacing: 2px; }
        
        canvas { background: #022c22; border: 1px solid var(--border); display: block; margin: 1rem auto; border-radius: 4px; max-width: 100%; height: auto; }
        
        .score-board { font-size: 1.2rem; margin-bottom: 0.5rem; color: #f59e0b; font-weight: bold; }
        .btn { padding: 0.8rem 1.5rem; background: var(--accent); color: #022c22; border: none; font-weight: bold; font-size: 1rem; cursor: pointer; border-radius: 4px; text-transform: uppercase; width: 100%; max-width: 250px; margin: 0.5rem auto; display: inline-block; }
        .btn:hover { background: #059669; color: #fff; }
        
        /* Mobile Touch Controls */
        .controls-hint { font-size: 0.8rem; color: #6ee7b7; margin-bottom: 1rem; }
        .touch-pad { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 1rem; }
        .touch-btn { padding: 1.2rem; background: #022c22; border: 1px solid var(--accent); color: var(--accent); font-size: 1.2rem; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .touch-btn:active { background: var(--accent); color: #022c22; }

        #reward-box { display: none; margin-top: 1rem; background: #022c22; padding: 1.5rem; border: 1px solid var(--accent); border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>TRIAL 01: GRID RUNNER (HARD)</h2>
        <p class="controls-hint">Laptop: <strong>UP / DOWN</strong> arrows | Mobile: Tap <strong>UP / DOWN</strong> buttons below.<br>Target: <strong>20 Points</strong></p>
        
        <div class="score-board">SCORE: <span id="score">0</span> / 20</div>
        
        <canvas id="gameCanvas" width="480" height="250"></canvas>
        
        <button class="btn" id="start-btn" onclick="startGame()">INITIALIZE TRIAL</button>

        <!-- Mobile Touch Buttons -->
        <div class="touch-pad">
            <button class="touch-btn" onclick="movePlayer(-35)">▲ UP</button>
            <button class="touch-btn" onclick="movePlayer(35)">▼ DOWN</button>
        </div>

        <div id="reward-box">
            <h3 style="color: #34d399; margin-bottom: 0.5rem;">TRIAL CLEARED</h3>
            <p>Code Segment Alpha recovered: <strong style="color: #f59e0b; font-size: 1.2rem;">7492</strong></p>
            <p style="font-size: 0.85rem; color: #6ee7b7; margin-top: 10px;">Memorize this code and return to the main terminal hub.</p>
            <a href="index.html" class="btn" style="text-decoration: none; margin-top: 10px;">RETURN TO HUB</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let player = { x: 40, y: 105, size: 18 };
        let obstacles = [];
        let score = 0;
        let gameInterval, obstacleInterval;
        let isPlaying = false;

        // Keyboard controls
        document.addEventListener("keydown", (e) => {
            if (!isPlaying) return;
            if (e.key === "ArrowUp") movePlayer(-35);
            if (e.key === "ArrowDown") movePlayer(35);
        });

        function movePlayer(offset) {
            if (!isPlaying) return;
            player.y += offset;
            // Boundary checks
            if (player.y < 15) player.y = 15;
            if (player.y > canvas.height - 33) player.y = canvas.height - 33;
        }

        function startGame() {
            document.getElementById('start-btn').style.display = 'none';
            player.y = 105;
            obstacles = [];
            score = 0;
            document.getElementById('score').innerText = score;
            isPlaying = true;

            // Increased difficulty: faster interval ticks & faster obstacle spawn rates
            gameInterval = setInterval(updateGame, 15);
            obstacleInterval = setInterval(spawnObstacle, 900);
        }

        function spawnObstacle() {
            let positions = [20, 55, 90, 125, 160, 195, 220];
            let yPos = positions[Math.floor(Math.random() * positions.length)];
            // Harder speed variance
            let speed = 6.5 + Math.random() * 2;
            obstacles.push({ x: canvas.width, y: yPos, width: 22, height: 22, speed: speed });
        }

        function updateGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw player
            ctx.fillStyle = "#10b981";
            ctx.fillRect(player.x, player.y, player.size, player.size);

            // Draw & move obstacles
            ctx.fillStyle = "#f43f5e";
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= obs.speed;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

                // Collision detection
                if (
                    player.x < obs.x + obs.width &&
                    player.x + player.size > obs.x &&
                    player.y < obs.y + obs.height &&
                    player.y + player.size > obs.y
                ) {
                    endGame(false);
                }

                // Off screen scoring
                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                    score++;
                    document.getElementById('score').innerText = score;
                    if (score >= 20) {
                        endGame(true);
                    }
                }
            }
        }

        function endGame(won) {
            isPlaying = false;
            clearInterval(gameInterval);
            clearInterval(obstacleInterval);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (won) {
                document.getElementById('reward-box').style.display = 'block';
            } else {
                alert("CRITICAL COLLISION. TRIAL FAILED. RETRYING...");
                document.getElementById('start-btn').style.display = 'inline-block';
            }
        }
    </script>
</body>
</html>
