<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aethelgard | Cipher Gate 03</title>
    <style>
        :root { --bg: #061a14; --card: #0b2920; --accent: #10b981; --text: #ecfdf5; --border: #134e4a; --error: #f43f5e; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: var(--bg); color: var(--text); padding: 3rem 1rem; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 700px; width: 100%; background: var(--card); border: 1px solid var(--border); padding: 2.5rem; border-radius: 8px; box-shadow: 0 0 30px rgba(16,185,129,0.1); }
        h2 { color: var(--accent); margin-bottom: 1.5rem; letter-spacing: 2px; border-bottom: 1px dashed var(--border); padding-bottom: 10px; }
        .cipher-box { background: #022c22; padding: 1.5rem; font-size: 1.4rem; color: #f59e0b; text-align: center; letter-spacing: 4px; margin: 1.5rem 0; border-radius: 4px; border: 1px dashed var(--border); }
        input { width: 100%; padding: 1rem; background: #022c22; border: 1px solid var(--border); color: #fff; font-size: 1.1rem; text-align: center; letter-spacing: 2px; margin-bottom: 1rem; border-radius: 4px; }
        input:focus { outline: none; border-color: var(--accent); }
        .btn { width: 100%; padding: 1rem; background: var(--accent); color: #022c22; border: none; font-weight: bold; font-size: 1.1rem; cursor: pointer; border-radius: 4px; text-transform: uppercase; }
        .btn:hover { background: #059669; color: #fff; }
        .error { color: var(--error); margin-top: 10px; display: none; font-weight: bold; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h2>GATE 03: ANAGRAM DISRUPTION</h2>
        <p>The final security gate requires unscrambling a high-priority system directive word.</p>
        
        <div class="cipher-box">TRUINSDECT</div>
        
        <p style="font-size: 0.85rem; color: #6ee7b7; margin-bottom: 1.5rem;">Hint: Rearrange the letters to form a word related to unauthorized access detection.</p>
        
        <input type="text" id="answer" placeholder="ENTER UNSCRAMBLED WORD" autocomplete="off">
        <button class="btn" onclick="checkCipher()">SUBMIT PASSPHRASE</button>
        <div class="error" id="error-msg">ACCESS DENIED. INCORRECT ANAGRAM.</div>
    </div>

    <script>
        function checkCipher() {
            // TRUINSSECT unscrambles to INTRUDERS
            const val = document.getElementById('answer').value.toUpperCase().trim();
            if(val === "INTRUDERS") {
                window.location.href = "game3.html";
            } else {
                document.getElementById('error-msg').style.display = 'block';
                setTimeout(() => document.getElementById('error-msg').style.display = 'none', 2000);
            }
        }
    </script>
</body>
</html>
